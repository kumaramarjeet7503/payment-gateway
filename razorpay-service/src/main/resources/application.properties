spring.application.name=razorpay-pg
server.servlet.context-path=/razorpay-service
server.port=8080
server.hostname=localhost

# MySQL database configurations
spring.datasource.url=jdbc:mysql://localhost:3306/db_pg_razorpay?useSSL=false
spring.datasource.username=root
spring.datasource.password=root

# Optional: Specify the SQL dialect and Hibernate settings
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect



# Application config
app.message = This is for testing property
app.razorpayAuthentication = *********************
app.razorpayUrl = https://api.razorpay.com/v1/payment_links/
app.razorpayUsername = *****************
app.razorpayPassword = ******************
app.callbackUrl = /api/payment/callback

